<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shahmir Qureshi</title>
  <meta name="description" content="Shahmir Qureshi. Portfolio coming soon.">
  <meta name="theme-color" content="#F7FAF9">
  <!-- SQ monogram favicon: teal on near-white, no shadow, gradient or outline -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F7FAF9'/%3E%3Ctext x='32' y='43' font-family='Inter,Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%230F766E'%3ESQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0F766E;
      --ink: #0B1F1E;
      --paper: #F7FAF9;
      --mint: #DDF5EA;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      text-align: center;
      padding: 28vh 16px 48px;
    }
    .label {
      display: inline-block;
      background: var(--mint);
      color: var(--teal);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.15;
      font-weight: 700;
      margin: 0 0 12px;
    }
    p { margin: 0; }
    .line { color: var(--teal); font-weight: 500; }
    @media (max-width: 420px) {
      h1 { font-size: 32px; }
      body { padding-top: 22vh; }
    }
  </style>
</head>
<body>
  <main>
    <span class="label">Portfolio in progress</span>
    <h1>Shahmir Qureshi</h1>
    <p class="line">Web, data and AI. Coming soon.</p>
  </main>
</body>
</html>
